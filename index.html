<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date and Time Display</title>
    <style>
        body {
            background: url('rgb_keyboard_background.jpg') no-repeat center center fixed;
            background-size: cover;
        }
        .time-display {
            background-color: white;
            border: 2px solid black;
            padding: 20px;
            border-radius: 10px;
            width: fit-content;
            margin: auto;
            text-align: center;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="time-display">
        <p>Current Date and Time (UTC): 2026-03-24 13:08:08</p>
    </div>
</body>
</html>
